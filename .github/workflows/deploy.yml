name: Deploy Kothar VPS

# Temporary containment: do not restore deployment until the protected verifier,
# artifact binding and production controls have independent evidence.
on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions: {}

jobs:
  production-blocked:
    name: Production promotion blocked
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse promotion without verified production controls
        shell: bash
        run: |
          echo '::error::Deploy bloqueado: verificador independente, vinculação ao artefato e controles de produção ainda pendentes.'
          echo 'Este workflow não acessa credenciais nem altera a VPS. Testes locais não autorizam promoção.'
          exit 1
