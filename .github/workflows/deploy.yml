name: Deploy Kothar VPS

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: 184.107.115.190
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Kothar Update
            cd /opt/apps/kothar || (git clone git@github.com:agestrategia360-sudo/kothar.git /opt/apps/kothar && cd /opt/apps/kothar)
            git fetch origin
            git reset --hard origin/master
            git clean -fd
            
            # Subir infra
            docker compose build
            docker compose up -d
