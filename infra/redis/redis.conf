# Kothar Redis — Configuração de Produção
# Persistência AOF habilitada
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memória
maxmemory 200mb
# Sessões e contadores de segurança nunca podem desaparecer para abrir acesso.
maxmemory-policy noeviction

# Segurança
protected-mode yes

# Performance
tcp-keepalive 300
timeout 0

# Logging
loglevel notice
