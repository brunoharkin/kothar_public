server {
    listen 80;
    server_name localhost;
    server_tokens off;
    client_max_body_size 10m;

    # Only a local TLS reverse proxy may publish this loopback-bound service.
    # HSTS is effective on HTTPS responses from that edge.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # Do not log request URLs: they can contain personal data or query tokens.
    access_log off;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Auth -> Harness API
    location /api/auth/ {
        proxy_pass http://kothar_harness_api:3000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy cbm-ui
    location /cbm-ui/ {
        proxy_pass http://kothar_api:8080/cbm-ui/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy API Geral -> Kothar API
    location /api/ {
        proxy_pass http://kothar_api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Metrics stay on the private API; never publish through the browser edge.
    location = /metrics {
        return 404;
    }

    location = /health/ {
        proxy_pass http://kothar_api:8080/health/;
    }

    location /health/ {
        return 404;
    }
}
