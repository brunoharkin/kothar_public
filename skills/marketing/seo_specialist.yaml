# ===========================================================
# KOTHAR SKILL — Especialista em SEO (Claude SEO)
# Marketing Kothar | Ugarit Digital
# ===========================================================
# Especialista focado em auditoria técnica, otimização 
# para mecanismos de busca e inteligência de mercado (GEO/AEO).
