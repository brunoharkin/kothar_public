## 🎯 PRINCÍPIO FUNDAMENTAL

```
╔═══════════════════════════════════════════════════════════════════════════╗
║                                                                           ║
║   SEGURANÇA NÃO É UMA ETAPA - É PARTE DO CÓDIGO                         ║
║                                                                           ║
║   O agente deve PARAR quando ver:                                        ║
║   → Credenciais no código                                                ║
║   → Tokens no localStorage                                               ║
║   → Logs com dados sensíveis                                             ║
║   → Input não validado                                                   ║
║                                                                           ║
╚═══════════════════════════════════════════════════════════════════════════╝
```

