## 📚 REFERÊNCIA RÁPIDA

### Frontend Seguro

```
FRONTEND ✅:
   - Exibir dados da API
   - Coletar input do usuário
   - Enviar para backend processar
   - Validações visuais (formato, obrigatoriedade)

FRONTEND ❌:
   - Guardar tokens
   - Guardar API keys
   - Guardar senhas
   - Conectar direto em bancos
   - Expor IPs internos
```

### Backend Seguro

```
BACKEND ✅:
   - Variáveis de ambiente para credenciais
   - Cookies HttpOnly para tokens
   - Validação de TODO input
   - Prepared statements para SQL
   - Logging de ações (não dados)

BACKEND ❌:
   - Credenciais no código
   - Logs com passwords/tokens/keys
   - Input não validado
   - SQL com interpolação direta
```

