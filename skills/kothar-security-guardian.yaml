## 🔍 COMO ENXERGAR PROBLEMAS

### Padrões para DETECTAR Automaticamente

```
DETECÇÃO AUTOMÁTICA:
═══════════════════════════

CREDENCIAIS:
   sk-xxxx → PARAR - API key exposta
   ghp_xxxx → PARAR - GitHub token exposto
   AKIAxxxx → PARAR - AWS key exposta
   "password": "xxxx" → PARAR - Password hardcoded

STORAGE:
   localStorage.setItem('token' → PARAR - Token exposto
   localStorage.setItem('key' → PARAR - Key exposta

LOGS:
   console.log(...token) → PARAR - Log de token
   console.log(...password) → PARAR - Log de senha
   logger.info(...secret → PARAR - Log de secret

SQL:
   f"SELECT * FROM {table}" → PARAR - SQL Injection
   .format() em SQL → PARAR - SQL Injection

XSS:
   dangerouslySetInnerHTML → PARAR - XSS
   innerHTML = → PARAR - XSS
```

