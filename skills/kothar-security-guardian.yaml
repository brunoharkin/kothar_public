## 🟠 REGRAS DE PROJETO

### PARA FRONTEND

```
VALIDAÇÕES MENTAIS AO ESCREVER FRONTEND:
═══════════════════════════════════════════

PERGUNTA 1: Este código vai processar CREDENCIAL?
   → Sim? → MUDAR para chamada API
   → Não? → Continuar

PERGUNTA 2: Este código vai guardar TOKEN?
   → Sim? → MUDAR para cookie HttpOnly
   → Não? → Continuar

PERGUNTA 3: Este código vai expor IP interno?
   → Sim? → USAR variável de ambiente
   → Não? → Continuar

PADRÕES FRONTEND:
✅ PODE: Exibir dados da API
✅ PODE: Coletar input do usuário
✅ PODE: Enviar para backend processar
❌ NÃO PODE: Guardar tokens
❌ NÃO PODE: Guardar API keys
❌ NÃO PODE: Conectar direto em bancos
```

### PARA BACKEND

```
VALIDAÇÕES MENTAIS AO ESCREVER BACKEND:
═══════════════════════════════════════════

PERGUNTA 1: Preciso de CREDENCIAL?
   → Sim? → USAR os.getenv('NOME')
   → Não? → Continuar

PERGUNTA 2: Input do usuário está sendo usado?
   → Sim? → VALIDAR com pydantic/marshmallow
   → Não? → Continuar

PERGUNTA 3: Estou fazendo LOG?
   → Sim? → VERIFICAR: senha? token? key?
   → Não? → Continuar

PADRÕES BACKEND:
✅ DEVE: Variáveis de ambiente para credenciais
✅ DEVE: Validar TODO input
✅ DEVE: Cookies HttpOnly para tokens
✅ DEVE: Logging seguro
❌ NÃO DEVE: Credenciais no código
❌ NÃO DEVE: Logs com dados sensíveis
```

