## 🔴 REGRAS CRÍTICAS (PARAR SE VIOLAR)

### REGRA 1: CREDENCIAIS NO CÓDIGO = CRÍTICO

```
❌ NUNCA ESCREVER:
   const apiKey = "sk-xxxx-xxxx";
   const token = "ghp_xxxx";
   const password = "minha-senha";

✅ SEMPRE FAZER:
   # Backend
   import os
   api_key = os.getenv('API_KEY')

   # Frontend (via API, não diretamente)
   const data = await api.get('/credentials');
```

### REGRA 2: TOKEN NO localStorage = CRÍTICO

```
❌ NUNCA ESCREVER:
   localStorage.setItem('token', response.token);
   localStorage.setItem('apiKey', key);
   sessionStorage.setItem('token', token);

✅ SEMPRE FAZER:
   # Backend define cookie HttpOnly
   # Frontend usa credentials: 'include'
   const response = await fetch('/api/login', {
     credentials: 'include'
   });
```

### REGRA 3: LOG DE DADOS SENSÍVEIS = CRÍTICO

```
❌ NUNCA ESCREVER:
   console.log('Token:', token);
   logger.info('Password:', password);
   print(f'Secret: {secret}');

✅ SEMPRE FAZER:
   console.log('Login successful');
   logger.info('User logged in', { userId });
```

