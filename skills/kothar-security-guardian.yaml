## 📋 CHECKLIST DE AUTOVERIFICAÇÃO

### Antes de Salvar (OBRIGATÓRIO)

```
VERIFICAÇÃO RÁPIDA:
════════════════════════

[ ] 1. Credenciais no código?
    → Ctrl+F: "sk-" | "ghp_" | "password" | "secret"
    → Se encontrar: REMOVER

[ ] 2. Tokens no localStorage?
    → Ctrl+F: "localStorage.setItem"
    → Se encontrar: MUDAR para HttpOnly cookie

[ ] 3. Logs com dados sensíveis?
    → Ctrl+F: console.log | logger.info
    → Se encontrar: REMOVER dados sensíveis

[ ] 4. Input validado?
    → Verificar: pydantic validation, schema validation
    → Se não: ADICIONAR validação

[ ] 5. SQL seguro?
    → Ctrl+F: f" | .format( | + "
    → Se encontrar: MUDAR para prepared statements

[ ] 6. .env com valores reais?
    → Verificar: .gitignore inclui .env
    → Se não: ADICIONAR ao .gitignore
```

---

## 🚨 QUANDO PARAR E CORRIGIR

### LISTA DE PARAR/CORRIGIR

| Situação | Ação |
|----------|------|
| API key no código | PARA → Usa `os.getenv` |
| Token no localStorage | PARA → Usa HttpOnly cookie |
| Password no log | PARA → Remove do log |
| Input sem validação | PARA → Adiciona validação |
| SQL com interpolação | PARA → Usa prepared statement |
| .env no git | PARA → Remove do staging |
| IP hardcoded | PARA → Usa variável de ambiente |
| Secret no código | PARA → Usa variável de ambiente |

