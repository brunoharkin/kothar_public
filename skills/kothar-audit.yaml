# ============================================================
# SKILL: AUDITORIA DE SEGURANÇA KOTHAR v4.0
# ============================================================
# Este skill deve ser invocado em TODA alteração de código
# ============================================================

## Quando Usar
Este skill é **OBRIGATÓRIO** e deve ser invocado:
- Antes de qualquer alteração em código
- Após qualquer correção
- Antes de commits
- Ao trabalhar com dados sensíveis
- Ao trabalhar no frontend

## Checklist de Auditoria

### 1. VERIFICAÇÃO DE CREDENCIAIS
```
[ ] Nenhuma API key no código
[ ] Nenhum token em localStorage/sessionStorage
[ ] Nenhuma senha em variáveis
[ ] Nenhum secret em comentários
[ ] Nenhum Bearer token exposto
[ ] AWS/GitHub keys verificadas
```

### 2. VERIFICAÇÃO DO FRONTEND
```
[ ] Sem exposição de portas internas
[ ] Sem IPs hardcoded
[ ] Sem dados sensíveis no estado
[ ] Validações ocorrem no backend
[ ] Sem console.log com dados sensíveis
```

### 3. VERIFICAÇÃO DE LOGGING
```
[ ] Sem logging de passwords
[ ] Sem logging de tokens
[ ] Sem logging de API keys
[ ] Apenas ações de usuário logadas
[ ] Sem exposição de dados na resposta
```

### 4. VERIFICAÇÃO DE IMPORTS
```
[ ] Nenhum import quebrado
[ ] Todos os componentes existem
[ ] Caminhos de import corretos
[ ] Nenhum .env sendo commitado
```

## Como Invocar

```
/kothar audit [caminho]
```

Ou automaticamente via pre-commit hook.

