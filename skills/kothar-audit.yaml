## Fluxo de Trabalho

```
1. Receber tarefa
   ↓
2. Executar AUDITORIA (este skill)
   ↓
3. Consultar RAG para código existente
   ↓
4. Criar plano e salvar no cofre
   ↓
5. Implementar (uma coisa por vez)
   ↓
6. Testar
   ↓
7. Nova auditoria
   ↓
8. Commit
```

## Regras de Ouro

1. **SEGURANÇA PRIMEIRO** - Credenciais nunca no frontend
2. **TESTAR SEMPRE** - Após cada alteração
3. **RAG PRIMEIRO** - Consultar antes de criar
4. **UMA COISA POR VEZ** - Não fazer 10 mudanças de uma vez
5. **SALVAR PLANO** - No cofre, antes de implementar

## Penalidades

| Violação | Ação |
|----------|------|
| Credencial exposta | Reverter imediatamente |
| Dados em localStorage | Refatorar para backend |
| Log de senha/token | Limpar logs, rodar segurança |
| Código quebrado | Reverter commit |

## Exemplos de Violação

### ❌ ERRADO
```typescript
// NUNCA FAÇA ISSO
const apiKey = "sk-1234567890";
localStorage.setItem('token', 'meu-token');
console.log("Password:", user.password);
```

### ✅ CORRETO
```typescript
// SEMPRE FAÇA ISSO
const credentials = await api.getCredentials();
// Backend gerencia, frontend apenas exibe
```

