## ✅ PADRÕES SEGUROS POR TIPO

### Padrão: Credenciais no Backend

```python
# ✅ CORRETO - Backend Python
import os

class OpenAIIntegration:
    def __init__(self):
        self.api_key = os.getenv('OPENAI_API_KEY')  # Variável de ambiente

# ❌ ERRADO - NÃO FAÇA ISSO
api_key = "sk-xxxx-xxxx-xxxx"  # PROIBIDO
```

### Padrão: Token com HttpOnly Cookie

```python
# ✅ CORRETO - Backend
@app.post('/login')
async def login(credentials: LoginRequest):
    token = authenticate(credentials)
    response = JSONResponse({'status': 'ok'})
    response.set_cookie(
        key='session_token',
        value=token,
        httponly=True,  # JavaScript não acessa
        secure=True,     # Apenas HTTPS
        samesite='lax'
    )
    return response

# ❌ ERRADO - Frontend
localStorage.setItem('token', token)  # PROIBIDO
```

### Padrão: Validação de Input

```python
# ✅ CORRETO - Backend
from pydantic import BaseModel, validator

class UserInput(BaseModel):
    email: str
    password: str

    @validator('email')
    def validate_email(cls, v):
        if '@' not in v:
            raise ValueError('Email inválido')
        return v

# ❌ ERRADO - NÃO FAÇA ISSO
async def register(email, password):
    # Sem validação! NUNCA.
    db.insert(email=email, password=password)
```

### Padrão: Logging Seguro

```python
# ✅ CORRETO
logger.info(f"User {user_id} logged in")
logger.warning(f"Invalid login for {email}")

# ❌ ERRADO
logger.info(f"Token: {token}")  # PROIBIDO
logger.info(f"Password: {password}")  # PROIBIDO
