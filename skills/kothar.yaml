## 🛡️ DETECÇÃO AUTOMÁTICA DE PROBLEMAS

### Padrões para DETECTAR ao Escrever Código

```
AO ESCREVER QUALQUER LINHA DE CÓDIGO:

PROCURE POR:
═══════════════════════════════════════════

CREDENCIAIS:
   ❌ "sk-" → API Key exposta - REMOVER
   ❌ "ghp_" → GitHub token - REMOVER
   ❌ "AKIA" → AWS key - REMOVER
   ❌ "password" = "valor" → Password hardcoded - REMOVER

STORAGE:
   ❌ localStorage.setItem → Token exposto - MUDAR para HttpOnly

LOGS:
   ❌ console.log(...token...) → Log de token - REMOVER token
   ❌ console.log(...password...) → Log de senha - REMOVER

SQL:
   ❌ f"SELECT * FROM {table}" → SQL Injection - USAR prepared statement

XSS:
   ❌ dangerouslySetInnerHTML → XSS - SANITIZAR
   ❌ innerHTML = → XSS - USAR textContent
```

