## ⚠️ SEGURANÇA É PARTE DO CÓDIGO, NÃO UMA ETAPA

```
╔═══════════════════════════════════════════════════════════════════════════╗
║                                                                           ║
║   REGRAS CRÍTICAS DE SEGURANÇA (O AGENTE DEVE ENXERGAR)                 ║
║                                                                           ║
║   ❌ CREDENCIAIS NO CÓDIGO → PARAR IMEDIATAMENTE                        ║
║   ❌ TOKEN NO localStorage → PARAR IMEDIATAMENTE                        ║
║   ❌ LOG COM DADOS SENSÍVEIS → PARAR IMEDIATAMENTE                      ║
║   ❌ INPUT SEM VALIDAÇÃO → PARAR IMEDIATAMENTE                          ║
║   ❌ SQL COM INTERPOLAÇÃO → PARAR IMEDIATAMENTE                         ║
║                                                                           ║
║   ✅ Segurança deve ser aplicada DURANTE a escrita, não depois          ║
║                                                                           ║
╚═══════════════════════════════════════════════════════════════════════════╝
```

---

## 🔴 REGRAS CRÍTICAS (PARAR SE VIOLAR)

### REGRA 1: CREDENCIAIS NO CÓDIGO = CRÍTICO

```
❌ NUNCA ESCREVER:
   const apiKey = "sk-xxxx-xxxx";
   const token = "ghp_xxxx-xxxx";
   const password = "minha-senha";

✅ SEMPRE FAZER:
   # Backend (Python)
   import os
   api_key = os.getenv('OPENAI_API_KEY')

   # Frontend - VIA API, NÃO diretamente
   const credentials = await api.get('/credentials');
```

### REGRA 2: TOKEN NO localStorage = CRÍTICO

```
❌ NUNCA ESCREVER:
   localStorage.setItem('token', response.token);
   sessionStorage.setItem('token', token);

✅ SEMPRE FAZER:
   # Backend: Cookie HttpOnly
   response.set_cookie(key='token', value=token, httponly=True)

   # Frontend: credentials: 'include'
   const response = await fetch('/api/login', {
     credentials: 'include'  // Envia cookie automático
   });
```

### REGRA 3: LOG DE DADOS SENSÍVEIS = CRÍTICO

```
❌ NUNCA ESCREVER:
   console.log('Token:', token);
   logger.info('Password:', password);
   console.log('API Key:', apiKey);

✅ SEMPRE FAZER:
   console.log('Authenticated successfully');
   logger.info('User logged in', { userId });
   logger.info('Login failed for email', { email }); // Sem dados sensíveis
```

### REGRA 4: FRONTEND SÓ EXIBE, BACKEND GERENCIA

```
FRONTEND ✅ PODE:
   - Exibir dados da API
   - Coletar input do usuário
   - Enviar para backend processar
   - Validações visuais

FRONTEND ❌ NÃO PODE:
   - Guardar tokens
   - Guardar API keys
   - Guardar senhas
   - Conectar direto em bancos
   - Expor IPs internos
```

