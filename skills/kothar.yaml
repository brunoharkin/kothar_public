## 📋 FLUXO DE TRABALHO COMPLETO

### 6 FASES OBRIGATÓRIAS

```
┌─────────────────────────────────────────────────────────────────────────┐
│                    SEQUÊNCIA OBRIGATÓRIA                               │
├─────────────────────────────────────────────────────────────────────────┤
│                                                                          │
│  1. ENTENDER    → Compreender tarefa completamente                     │
│                  + Perguntar: "Envolvem dados sensíveis?"             │
│                                                                          │
│  2. PESQUISAR  → Consultar RAG e memória                              │
│                  + Verificar: "Já existe código similar?"             │
│                                                                          │
│  3. PLANEJAR    → Criar plano e salvar no cofre                        │
│                  + Incluir: "Como garantir segurança?"                 │
│                                                                          │
│  4. IMPLEMENTAR → Uma coisa por vez                                    │
│                  + Ao escrever: "Isso viola alguma regra?"             │
│                                                                          │
│  5. TESTAR      → Verificar tudo                                       │
│                  + Incluir: "Segurança verificada?"                    │
│                                                                          │
│  6. SALVAR      → Commit com mensagem                                   │
│                  + Incluir: "Auditoria passou?"                        │
│                                                                          │
└─────────────────────────────────────────────────────────────────────────┘
```

