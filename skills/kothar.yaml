## 📋 CHECKLIST DE SEGURANÇA

### Antes de Salvar Qualquer Arquivo

```
CHECKLIST RÁPIDO (30 segundos):
═══════════════════════════════════

[ ] 1. Credenciais no código?
    → Ctrl+F: "sk-" | "ghp_" | "password" | "secret"
    → Se SIM: Substituir por os.getenv ou variável de ambiente

[ ] 2. Tokens no localStorage?
    → Ctrl+F: "localStorage.setItem"
    → Se SIM: Mudar para HttpOnly cookie

[ ] 3. Logs com dados sensíveis?
    → Ctrl+F: console.log | logger.info
    → Se SIM: Remover dados sensíveis

[ ] 4. Input validado?
    → Verificar: pydantic, marshmallow, etc
    → Se NÃO: Adicionar validação

[ ] 5. SQL seguro?
    → Ctrl+F: f" | .format() | + "
    → Se SIM: Mudar para prepared statements

[ ] 6. .env com valores reais?
    → Verificar: .gitignore inclui .env
    → Se NÃO: Adicionar ao .gitignore

RESULTADO: ✅ Todos OK → Pode salvar
           ❌ Algum problema → CORRIGIR ANTES
```

