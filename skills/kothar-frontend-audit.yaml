name: kothar-frontend-audit
description: Auditoria específica para trabalho em frontend - verificação obrigatória

# ============================================================
# SKILL: AUDITORIA DE FRONTEND KOTHAR v4.0
# ============================================================
# Este skill deve ser usado em TODA alteração de frontend
# ============================================================

## Quando Usar
- Ao modificar arquivos `.tsx`, `.ts`, `.jsx`, `.js`
- Ao adicionar dependências
- Ao modificar componentes
- Antes de commits em frontend

## Checklist de Auditoria de Frontend

### 1. SEGURANÇA
```
[ ] Nenhuma credencial no código
[ ] Nenhum token em localStorage
[ ] Nenhum IP/porta exposto
[ ] Sem console.log com dados sensíveis
[ ] API calls vão para o backend
```

### 2. COMPILAÇÃO
```
[ ] npm run dev funciona
[ ] npm run build funciona
[ ] TypeScript sem erros (npx tsc --noEmit)
[ ] Lint sem erros (npm run lint)
```

### 3. CONSOLE DO NAVEGADOR
```
[ ] Zero erros (ERROR)
[ ] Zero warnings de segurança
[ ] WebSocket conectado
[ ] API respondendo
```

### 4. FUNCIONALIDADES
```
[ ] Login funciona
[ ] Navegação funciona
[ ] Dados carregam
[ ] Formulários validam
[ ] Funcionalidades relacionadas funcionam
[ ] Nada existente quebrou
```

### 5. IMPORTS
```
[ ] Todos os imports existem
[ ] Nenhum import quebrado
[ ] Componentes referenciados existem
[ ] Caminhos corretos
```

## Ferramentas de Teste

```bash
# Validar frontend completo
/home/bruno/kothar/scripts/kothar_frontend_validator.sh

# Apenas TypeScript
cd /home/bruno/Orby.ia/frontend
