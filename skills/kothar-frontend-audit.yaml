npm run build
```

## Regras de Ouro para Frontend

```
╔═══════════════════════════════════════════════════════════════════╗
║  FRONTEND = EXIBIR, BACKEND = GERENCIAR                     ║
║                                                                ║
║  ❌ NUNCA:                                                   ║
║     • Esconder tokens em variáveis                            ║
║     • Salvar credenciais                                      ║
║     • Conectar direto em bancos                               ║
║     • Expor portas internas                                   ║
║                                                                ║
║  ✅ SEMPRE:                                                  ║
║     • Buscar dados da API                                    ║
║     • Enviar dados para backend processar                     ║
║     • Exibir, não guardar                                    ║
╚═══════════════════════════════════════════════════════════════════╝
```

## Fluxo de Trabalho em Frontend

```
1. Receber tarefa
   ↓
2. Consultar RAG por código similar
   ↓
3. Criar plano (salvar no cofre)
   ↓
4. Modificar código (UMA coisa por vez)
   ↓
5. Testar (npm run dev + console)
   ↓
6. Se OK → próxima mudança
   ↓
7. Se ERRO → corrigir e testar novamente
   ↓
8. Auditoria final de segurança
   ↓
9. Commit
```

## Erros Comuns a Evitar

| Erro | Solução |
|------|---------|
| Import quebrado | Verificar se arquivo existe |
| localStorage com token | Backend deve gerenciar |
| Credencial no código | Buscar do backend |
| Console com password | Remover logging |
| IP hardcoded | Usar variáveis de ambiente |

## Exemplo de Boa Prática

```typescript
// ❌ ERRADO
const token = localStorage.getItem('token');
api.post('/data', { token, password: '123' });

// ✅ CORRETO
const response = await api.post('/login', { email, password });
// Backend retorna token, frontend apenas exibe
```

